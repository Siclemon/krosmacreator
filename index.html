<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto" rel="stylesheet">
</head>

<body>
    <div class="all">
        <div>
            <div>
                <label for="nom">Nom</label>
                <input type="text" name="nom" id="nom">
            </div>
            <div>
                <label for="pa">PA</label>
                <input type="number" name="pa" id="pa">
            </div>
            <div>
                <label for="at">AT</label>
                <input type="number" name="at" id="at">
            </div>
            <div>
                <label for="pv">PV</label>
                <input type="number" name="pv" id="pv">
            </div>
            <div>
                <label for="pm">PM</label>
                <input type="number" name="pm" id="pm">
            </div>
            <div>
                <label for="effet">Effet</label>
                <textarea name="effet" id="effet"></textarea>
            </div>
            <div>
                <label for="img">Image</label>
                <input type="file" name="img" id="img">
            </div>
        </div>
        <div>
            <div class="carte" id="card">
                <img src="/assets/card_front_summon_paper.png" alt="" id="template">
                <svg id="name" height="100" width="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg"
                    xmlns:xlink="http://www.w3.org/1999/xlink">
                    <defs>
                        <path id="CurvedPath" d="M 0 150 Q 400 130 800 150 " />
                    </defs>
                    <text font-size="94" x='325' y='50' text-anchor="middle" fill="#fffbf8"
                        font-family=Bernard style="text-shadow: 1px 0px 3px gray;">
                        <textPath id='nameText' xlink:href="#CurvedPath">Nom de la carte</textPath>
                    </text>
                </svg>
                <p id="desc">aocojcjze</p>
            </div>
        </div>
    </div>
</body>
<script src="script.js" defer type="module"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</html>
